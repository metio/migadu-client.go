name: Verify Commits
on:
  pull_request:
    branches: [ main ]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7
      - id: toolchain
        name: Set up Toolchain
        uses: metio/breto@3d35cbfa61e9b8e98fe3d92113390a6db219b66c # 2026.10.30182439
        with:
          registries: github:metio/toolchains
      - id: lint
        name: Lint Go Code
        run: |
          go vet ./...
          staticcheck ./...
          gosec -quiet ./...
          unformatted="$(gofumpt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - id: vulnerabilities
        name: Check Vulnerabilities
        run: govulncheck ./...
      - id: tests
        name: Run Tests
        run: go test -v -cover ./...
