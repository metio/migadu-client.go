name: Verify Commits
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: toolchain
        name: Set up Toolchain
        uses: metio/ci/breto@6e8776dc59abdfffa793903f100e89f1aacb9c2e # 2026.11.2023135
        with:
          registries: github:metio/toolchains
      - id: lint
        name: Lint Go Code
        run: |
          go vet ./...
          staticcheck ./...
          gosec -quiet ./...
          unformatted="$(gofumpt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - id: vulnerabilities
        name: Check Vulnerabilities
        run: govulncheck ./...
      - id: tests
        name: Run Tests
        run: go test -v -cover ./...
  verify:
    name: Verify
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify every job succeeded or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          [ -z "$bad" ] || { echo "::error::$bad"; exit 1; }
